<!DOCTYPE html>
<html>
  <head>
    <title>AI Poem Generator</title>
    <meta charset="UTF-8" />

    <link href="src/styles.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    
  </head>

  <body>
    <div class="container">
    <header>
    <h1>AI Hindi Poem Generator</h1>
    </header>
    <main>
        <div class="form-container">
    <form id="poem-generator-form">
        <input type="text" placeholder="Enter the topic of a Hindi poem" 
        autofocus 
        required 
        autocomplete="off" 
        class="instructions"
        id="user-instructions"/>
        <input type="submit" class="submit-button" />
        
    </form>
    <div class="hint">i.e., Flower, Banglore, Marigold</div>
    </div>
    
    <div>
        
    </div>
    
    <div id="poem hidden" class="poem"><div>
    </main>
    <footer>
    
        This AI project was coded by <a href="https://tejaswinisamanta.github.io/" target="_blank">Tejaswini Samanta</a>
         and is open-sourced on <a href="https://github.com/tejaswinisamanta/hindi-poem-generator" target="_blank">Github</a>
         and hosted on <a href="https://hindi-ai-poem-generator.netlify.app/" target="_blank">Netlify</a>.
    </footer>
    </div>

    <script src="src/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
  </body>
</html>
